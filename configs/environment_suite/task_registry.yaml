schemaVersion: e07.s02.task-registry.v1
suiteVersion: e07.s02.environment-suite.v1
researchStepId: S02
frozenAtUtc: '2026-07-21T00:00:00Z'
frozenQuestion: One evaluation interface can expose sorting, faults, detours, chimeras, regeneration, changing targets, and representative 2D tasks without metric leakage.
interface:
  methods: [reset, observation, step, cost, event, outcome]
  adapterStepMeaning: one complete predecessor-native evaluation unit
  commonReward: null
  commonCostTotal: null
  commonNormalizedTime: null
  outcomeVisibility: terminal_and_split_gated
  confirmationMaterializersPresent: false
communicationDelivery:
  profile: recipient_activation_lag_lww_sum_u8_v1
  observationTiming: before_current_native_action_and_emission
  topologySnapshot: pre_transition_neighbors
  persistence: until_recipient_next_activation
  collisionRule: last_write_wins_per_sender_channel_before_recipient_activation
  aggregation: deterministic_sender_sorted_saturating_sum_per_channel
  senderIdentityVisible: false
  sameEventRead: forbidden
  selfDelivery: forbidden
  consumption: all_pending_messages_consumed_on_recipient_activation
  legalityEffect: none
  nativeCostMutation: none
  separateLedgerFields: [emittedSignalWrites, transmittedSignalBits, recipientDeliveries, bufferOverwrites, consumedDeliveries, observableAggregateReads]
globalForbiddenObservationFields: &forbidden
  - analysis_label
  - split_label
  - protected_confirmation_outcome
  - outcome
  - completion
  - global_distance
  - future_state
  - future_random_draw
  - conflict_priority
  - raw_route
  - occupant_identity
  - target_membership
tasks:
  - taskId: e07_s02_sorting_1d
    title: One-dimensional sorting baseline
    family: sorting
    predecessor: E01
    runnerId: e01_sorting
    environmentProfile: line1d.v1
    legalityAuthority: E01-reference-v1 common validator and atomic commit
    actionContract:
      nativePrimitives: [NoOp, Swap, MemoryUpdate]
      proposalCountPerOpportunity: 1
      retry: no_retry
      baselinePolicyIds: [bubble_native_v1]
    observationContract:
      profile: policy_native_local
      typedDslProfile: line1d.v1
      forbiddenFields: *forbidden
    costContract:
      nativeFamilies: [E01_reference_10_field_ledger]
      scalarTotalPermitted: false
      normalization: none
    eventContract:
      authority: E01.reference-event-pre-S06.v1
      retainedProjection: digest_activation_count_stop
    stoppingContract:
      authority: E01_terminal_precedence
      states: [invariant_error, complete, quiescent, event_budget]
    outcomeContract:
      policyVisibleOnline: false
      fields: [completed, finalValues, finalStateHash]
    claimBoundary: Sorting is measured only in the deterministic reconstructed simulator and is not biological morphogenesis or a historical-output identity claim.
    horizon:
      nativeUnit: charged_activation_opportunity
      adapterStepGranularity: complete_native_episode
      budgets: {activationOpportunities: 6400}
      terminalPrecedence: [invariant_error, complete, quiescent, event_budget]
      censoringRule: event_budget_is_failure_for_completion_and_right_censor_for_time
      comparabilityGroup: e01_serial_activation
      comparableOnlyWithinGroup: true
      crossTaskNormalization: forbidden
    optionalExclusions: [historical_backend_exact_output]

