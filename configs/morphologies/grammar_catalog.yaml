schemaVersion: e06.s02.grammar-catalog.v1
researchStepId: S02
benchmarkVersion: e06-relational-grammar-v1
observationContract:
  neighborhood: von_neumann_4
  availableToOfflineScorer: [site_token, adjacent_site_tokens, local_boundary_flags, declared_orientation_frame, bounded_motif_window]
  forbidden: [cell_identity, algotype, analysis_label, future_state, target_membership, global_component_count, global_hole_count]
  policyBoundary: This grammar is an offline relational descriptor; S05 policies may receive only the explicitly budgeted local projection.
conflictResolution: hard_first_then_weighted_soft_v1
claimBoundary: Grammar satisfaction is a computational proxy and is never by itself target completion, biological morphology, affinity, agency, or causal evidence.

grammars:
  - grammarId: stripes_axis_relations_v1
    targetId: stripes_alternating_three_band
    shape: [9, 9]
    vacancyLabel: "."
    cellTypeCounts: {".": 0, A: 54, B: 27}
    orientationTransforms: [identity, rotate90, rotate180, rotate270, reflect_horizontal, reflect_vertical, reflect_main_diagonal, reflect_anti_diagonal]
    conflictResolution: hard_first_then_weighted_soft_v1
    acceptanceThreshold: 0.92
    constraints:
      - constraintId: stripes_middle_boundary_extent
        kind: boundary_count
        priority: hard
        weight: 3
        parameters: {token: B, sides: [any], min: 6, max: 6, deviationScale: 6}
      - constraintId: stripes_cross_type_interfaces
        kind: edge_count
        priority: soft
        weight: 3
        parameters: {tokens: [A, B], directions: all, min: 18, max: 28, deviationScale: 18}
      - constraintId: stripes_middle_cohesion
        kind: edge_count
        priority: soft
        weight: 2
        parameters: {tokens: [B, B], directions: all, min: 36, max: 42, deviationScale: 42}
      - constraintId: stripes_local_middle_support
        kind: neighbor_count
        priority: soft
        weight: 2
        parameters: {subject: B, neighborTokens: [B], directions: all, min: 2, max: 4, minSubjectFraction: 0.85}
      - constraintId: stripes_tangent_symmetry
        kind: symmetry
        priority: soft
        weight: 1
        parameters: {transform: reflect_vertical, frame: domain, maxMismatches: 4, deviationScale: 81}
    auditOnlyGlobalConstraints: [s01_equivalence_membership, exact_component_counts, minimum_hamming_mod_equivalence]
    underdeterminationHypothesis: Interface and cohesion constraints may accept corrugated, branched, or multi-band arrangements with the same composition.

