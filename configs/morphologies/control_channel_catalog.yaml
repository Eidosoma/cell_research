    channelId: static_gradient_v1
    environmentId: square_periodic_vacancy
    policyId: gradient_following_v1
    actorSite: r2_c2
    epochIndex: 0
    parameters: {axis: second, direction: up, scenarioKey: s06-gradient-fixture}
  - fixtureId: boundary_bounded_projection
    channelId: natural_boundary_signal_v1
    environmentId: square_bounded_occupied_stripes
    policyId: boundary_seeking_v1
    actorSite: r1_c1
    epochIndex: 0
    parameters: {direction: seek, actorTokens: [A], scenarioKey: s06-boundary-fixture}
  - fixtureId: sparse_instruction_coarse_region
    channelId: sparse_instruction_v1
    environmentId: square_periodic_vacancy
    epochIndex: 2
    parameters: {instruction: prefer_exploration, regionAlias: zone_1, regionSize: 4, regionCount: 5, scenarioKey: s06-instruction-fixture}
  - fixtureId: lagged_summary_broadcast
    channelId: lagged_global_summary_v1
    environmentId: square_periodic_vacancy
    epochIndex: 4
    parameters: {sourceEpoch: 3, activeCount: 8, dissatisfactionPattern: alternating_five_of_eight, submitted: 8, conflictLosses: 2, recipients: 8, scenarioKey: s06-summary-fixture}
  - fixtureId: direct_one_query_one_action
    channelId: sparse_direct_intervention_v1
    environmentId: square_bounded_occupied_stripes
    policyId: greedy_neighbor_satisfaction_v1
    actorSite: r2_c0
    stateTransform: adjacent_swap_r2_c0_r3_c0
    relationGrammarId: stripes_axis_relations_v1
    epochIndex: 3
    parameters: {populationSize: 81, scenarioKey: s06-direct-fixture}
