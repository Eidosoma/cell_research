  failClosedOnAnyHashOrPopulationChange: true

splitDesign:
  outcomesUsedForAssignment: false
  lineageComponent: transitive_ancestral_root_set_with_missing_native_parent_id_retained_as_root_token
  lineageAssignment: deterministic_group_size_balanced_60_20_20_with_sha256_tie_break
  lineageFractions: {fit: 0.60, calibration: 0.20, test: 0.20}
  scenarioFamilies:
    default: {fit: [0, 1, 2], calibration: [3], test: [4]}
    e07_s02_regeneration_1d: {fit: [0, 1], calibration: [2], test: [3]}
  primaryAudit: lineage_test_on_scenario_fit
  scenarioAudit: scenario_test_on_lineage_fit
  jointStressAudit: lineage_test_and_scenario_test
  calibrationPanels:
    lineage: lineage_calibration_on_scenario_fit
    scenario: scenario_calibration_on_lineage_fit
  rowIdentityOverlapAcrossLineagePartitionsPermitted: false
  policyLineageOverlapAcrossLineagePartitionsPermitted: false
  scenarioFamilyOverlapAcrossScenarioPartitionsPermitted: false

surrogates:
  taskSpecificModels: true
  universalScore: forbidden
  crossTaskTargetPooling: forbidden
  inputs:
    allowed: [policy_structure, typed_permissions, licensed_capability_flags, mutation_metadata, outcome_blind_scenario_ordinal]
    forbidden: [policy_hash_bytes, policy_id_tokens, scenario_id_tokens, event_summaries, native_costs, terminal_fields, outcomes, elapsed_seconds]
  targets:
    performance: all_frozen_S04_task_objectives
    costs: every_fully_qualified_numeric_S05_native_and_extension_ledger_field
    licensedCapabilities: separately_named_cost_targets_never_summed_into_native_cost
    explicitOutcomes: [failed, censored]
    structurallyMissingCost: explicit_presence_head_and_masked_value_loss
    operational: [elapsedSeconds]
    universalCostTotal: forbidden
  transformations:
    continuous: train_panel_z_score
    costs: signed_log1p_then_train_panel_z_score
    elapsedSeconds: log1p_then_train_panel_z_score
    binary: untransformed_probability
  simpleBaselines:
    - train_mean_or_prevalence
    - ridge_or_logistic_with_fixed_regularization
  gpuCandidate:
    architecture: task_specific_residual_mlp_ensemble
    hiddenWidths: [192, 128, 64]
    activation: SiLU
    dropout: 0.10
    ensembleMembers: 3
    optimizer: AdamW
    learningRate: 0.001
    weightDecay: 0.0001
    batchSize: 64
    maximumEpochs: 400
    earlyStoppingPatience: 50
    minimumEpochs: 80
    device: cuda:0
    deterministicAlgorithms: true
    seeds: [706001, 706002, 706003]
    lossWeights: {performance: 0.45, cost: 0.25, operational: 0.05, binary: 0.25}
  uncertainty:
    ensembleStandardDeviation: report
    conformalNominalCoverage: 0.90
    conformalMethod: split_absolute_residual_finite_sample_quantile
    calibrationPanelsSeparate: true
  ablations:
    - policy_only_gpu
    - policy_plus_scenario_gpu
    - ridge_or_logistic
    - constant

trajectorySummaryModel:
  evidenceBoundary: S05_persisted_event_and_sequence_summaries_only_no_full_trace_reconstruction_claim
  primaryRows: canonical_selected_S05_only
  rawUnionAblation: task_specific_union_fields_autoencoder
  deploymentCandidate: shared_semantic_event_summary_adversarial_autoencoder
  embeddingDimension: 6
  encoderWidths: [96, 48]
  decoderWidths: [48, 96]
  adversaries: [task_identity, within_task_log_length]
  adversaryWeights: {task: 0.35, length: 0.20}
  optimizer: AdamW
  learningRate: 0.001
  weightDecay: 0.0001
  batchSize: 128
  maximumEpochs: 500
  earlyStoppingPatience: 60
  minimumEpochs: 100
  seed: 706101
  baseline: PCA_same_dimension
  shortcutTests:
    taskProbe: grouped_5_fold_logistic_balanced_accuracy
    lengthProbe: grouped_5_fold_ridge_R2
    groups: task_plus_lineage_component

frozenThresholds:
  minimumAuditRowsPerTarget: 12
  surrogateUtility:
    taskObjectiveLossRatioVsRidgeMaximum: 0.98
    tasksRequiredBothLineageAndScenario: 6
    maximumAnyTaskObjectiveLossRatio: 1.10
    constantBaselineImprovementTasksRequired: 6
  continuousCalibration:
    nominalCoverage: 0.90
    minimumCoverage: 0.80
    maximumMedianIntervalWidthInTrainStandardDeviations: 4.0
    tasksRequiredBothLineageAndScenario: 7
  binaryCalibration:
    maximumECE: 0.15
    brierNoWorseThanConstantTolerance: 0.01
    tasksRequiredBothLineageAndScenario: 6
  failureAndCensoring:
    nonconstantHeadBrierNoWorseThanConstantTolerance: 0.01
    heavyTailE05CoverageMinimum: 0.75
  embeddingDeployment:
    maximumTaskBalancedAccuracy: 0.35
    maximumWithinTaskLengthR2: 0.25
    maximumReconstructionMseRatioVsPCA: 1.05
  deploymentRule: all_surrogate_calibration_utility_failure_censoring_and_embedding_threshold_families_must_pass
  failureAction: reject_models_for_S07_allocation_or_archive_mutation

subgroups:
  required:
    - task
    - failed
    - censored
    - e05_runtime_tail_quartile
    - e05_native_event_length_tail_quartile
  e05HeavyTailDefinition: within_E05_task_top_quartile_of_primary_fit_log1p_elapsed_or_native_event_length_threshold_applied_to_audit_rows

validation:
  requireCanonicalHashes: true
  requireNoProtectedOutcomeRows: true
  requirePrimaryAndOrphanDisjoint: true
  requireAllFailuresAndCensorsRetained: true
  requireDeterministicReplay: true
  requireIdentifierLeakageAudit: true
  requireTaskLengthShortcutTests: true
  requireModelAndEmbeddingHashes: true
  requireInferenceReloadParity: true

claimBoundary: S06 models are exploratory train-derived computational surrogates and event-summary embeddings. They are not held-out predecessor validation, confirmation, causal or biological evidence, full-trajectory representations, or a universal task score.
