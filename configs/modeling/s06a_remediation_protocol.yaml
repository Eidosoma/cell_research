  requireFreshLoadInferenceParity: true
  requireCompleteBudgetAccounting: true

claimBoundary: S06A remains exploratory train-derived computational remediation. Passing unchanged gates would authorize only these remediated bundles for S07 allocation; it would not validate rejected S06 bundles, open protected outcomes, establish held-out efficacy, create a universal score, or support causal, biological, full-trajectory, clinical, or civic claims.
