  policyLineageOverlapAcrossLineagePartitionsPermitted: false
  scenarioFamilyOverlapAcrossScenarioPartitionsPermitted: false

surrogates:
  taskSpecificModels: true
  universalScore: forbidden
  crossTaskTargetPooling: forbidden
  architecture:
    label: targetwise_extra_trees_ridge_logistic_blend_v1
    implementation: independent_sklearn_target_heads_no_neural_residual_connections
    mismatchCorrected: true
  inputs:
    allowed: [policy_structure, typed_permissions, licensed_capability_flags, mutation_metadata, outcome_blind_within_source_family_index, outcome_blind_source_generation]
    forbidden: [policy_hash_bytes, policy_id_tokens, scenario_id_tokens, raw_seed, split_label, event_summaries, native_costs, terminal_fields, outcomes, elapsed_seconds]
  targets:
    performance: all_frozen_S04_task_objectives
    costs: every_fully_qualified_numeric_native_and_extension_ledger_field
    licensedCapabilities: separately_named_cost_targets_never_summed_into_native_cost
    explicitOutcomes: [failed, censored]
    structurallyMissingCost: explicit_presence_head_and_masked_value_loss
    operational: [elapsedSeconds]
    universalCostTotal: forbidden
  transformations:
    continuous: fit_panel_z_score
    costs: signed_log1p_then_fit_panel_z_score
    elapsedSeconds: log1p_then_fit_panel_z_score
    binary: untransformed_probability
  simpleBaselines:
    - fit_mean_or_prevalence
    - targetwise_ridge_alpha_10
    - targetwise_logistic_C_1
    - policy_only_ridge_or_logistic
  nonlinearHead:
    estimator: ExtraTrees
    nEstimators: 128
    maximumDepth: 10
    minimumSamplesLeaf: 3
    maximumFeatures: 0.8
    bootstrap: false
    nJobsPerFit: 1
    randomSeedBase: 706500
    continuousUse: performance_only
    binaryUse: all_nonconstant_binary_heads
    otherContinuousUse: ridge_only
  calibrationBlend:
    nonlinearWeights: [0.0, 0.25, 0.5, 0.75, 1.0]
    binaryConstantShrinkage: [0.0, 0.25, 0.5, 0.75, 1.0]
    selectionPanels: [lineage_calibration, scenario_calibration]
    continuousCriterion: minimize_max_panel_RMSE_then_mean_RMSE
    binaryCriterion: minimize_max_panel_Brier_plus_ECE_excess_then_mean_Brier
    ties: prefer_more_constant_shrinkage_then_less_nonlinear_weight
    testPanelsUsedForSelection: false
  uncertainty:
    nominalCoverage: 0.90
    method: separate_split_absolute_residual_finite_sample_quantile
    calibrationPanelsSeparate: true
    e05HeavyTailModeledExplicitly: true
    e05TailDefinition: fit_panel_top_quartile_of_elapsed_or_native_event_length_for_subgroup_audit_and_balanced_status_weights
  ablations: [constant, ridge_or_logistic, policy_only_ridge_or_logistic, unblended_extra_trees, remediated_blend]

eventSummaryModel:
  label: fit_only_task_length_residualized_pca_v1
  implementation: deterministic_linear_nuisance_residualization_then_six_component_PCA
  fullTraceRepresentation: false
  evidenceBoundary: persisted_event_and_sequence_summaries_only
  primaryRows: combined_base_selected_and_added_training_rows
  recoveryOrphans: post_freeze_sensitivity_only
  sharedSemanticFeatures: frozen_S06_shared_event_features
  vectorizerFit: joint_fit_panel_only
  nuisanceFit: joint_fit_panel_only
  nuisanceVariables: [task_one_hot, within_task_standardized_log_event_length]
  taskWithinScaling: fit_panel_only
  embeddingDimension: 6
  reconstructionTarget: task_and_length_residualized_shared_semantic_features
  reconstructionBaseline: PCA_same_dimension_same_residualized_target
  shortcutTests:
    taskProbe: lineage_grouped_5_fold_logistic_balanced_accuracy_with_fold_local_standardization
    lengthProbe: lineage_grouped_5_fold_ridge_R2_with_fold_local_standardization
  rawUnionAblation: none_due_prior_convergence_failure

