issue: The initial post-fit validator required every retained evaluation row to have all native validation flags true, which contradicts the frozen requirement to retain and explicitly model failed rows.
amendedRule: A row with one or more false native validation flags must remain in the primary training population, must have failed=true, and must retain the original false flags. Any false flag on failed=false remains an accounting failure.
