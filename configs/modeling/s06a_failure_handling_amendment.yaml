permittedEffect: Correct failure-accounting validation only, before fitting.
forbiddenEffects: [row_deletion, outcome_reclassification, threshold_change, model_change, split_change, evaluation_change, archive_mutation, protected_access]
claimBoundary: This amendment does not turn failed episodes into successful validations; it preserves them as explicit failed outcomes for status modeling.
