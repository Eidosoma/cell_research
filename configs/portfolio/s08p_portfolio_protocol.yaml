    S04A runners accept one DSL policy for E01-E03, E05, and E06; only E04
    supports a two-native-carrier binding. Identity-level multi-policy assignment,
    bounded within-carrier switching, separate member memory, and portfolio cost
    extraction therefore require a bounded train-only qualification before S08
    evaluation.
