schemaVersion: e07.s09.ablation-compression-protocol.v1
researchStepId: S09
title: Ablate and compress discoveries
frozenQuestion: >-
  Within the seven S08M-eligible spatial portfolios, which member, selector,
  rule, memory, observation, and sensing mechanisms are necessary on paired
  authorized training scenarios, and how far can each portfolio be compressed
  under a bounded deterministic edit registry without claiming global
  minimality?

