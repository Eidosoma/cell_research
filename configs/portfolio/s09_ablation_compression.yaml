editRegistry:
  order:
    - member_delete
    - selector_remove_to_fixed_balanced
    - selector_branch_flip_control
    - fixed_assignment_rotation_control
    - rule_delete
    - memory_freeze_register
    - observation_predicate_erase
    - sensing_delta_to_counter_index
    - sensing_restrict_adjacent_radius_one
    - sensing_remove_positive_filter
    - exact_runtime_sham
  memberDeletionMinimumPortfolioSize: 2
  ruleDeletion: each_declared_rule
  memoryAblation: freeze_one_register_at_its_declared_initial_value
  observationAblation: replace_each_condition_using_one_scalar_with_true_then_simplify
  sensingAblations:
    - replace_candidate_delta_arg_selector_with_counter_index
    - restrict_nonlocal_movement_kinds_to_adjacent_swap_and_radius_one
    - remove_positive_candidate_filter
  signalAblation: structurally_inapplicable_when_all_member_channels_zero
  communicationAblation: structurally_inapplicable_when_all_member_channels_zero
  selectorAblations:
    conditioned:
      - remove_selector_and_use_fixed_balanced_identity
      - reverse_the_two_frozen_branches_as_complexity_matched_control
    fixed:
      - rotate_balanced_assignment_by_one_as_complexity_matched_control
  sham: exact_member_programs_mode_selector_and_costs_with_a_hash_distinct_audit_tag
  arbitraryNewRules: forbidden
  thresholdTuning: forbidden
  outcomeTunedEditGeneration: forbidden

deltaDebugging:
  candidateOrder: >-
    individually-equivalent causal edits only, descending structural byte
    reduction, then frozen edit-family order, then edit ID
  freshPanelRequired: true
  reapplyToCurrentCompressedState: true
  maximumAcceptedEditsPerParent: 8
  stopWhen:
    - all_individually_equivalent_candidates_attempted
    - eight_edits_accepted
    - integrity_failure
  rejectedEditReconsideration: forbidden

scenarioPanels:
  screening:
    ordinals: [500, 627]
    count: 128
    purpose: every_first_order_edit_and_parent_sham
  cumulative:
    ordinals: [700, 955]
    count: 256
    purpose: deterministic_delta_debugging_attempts
  crossSpatialRegression:
    ordinals: [1100, 1355]
    count: 256
    purpose: frozen_parent_and_final_compression_on_both_spatial_tasks
  derivation: outcome_blind_counter_schedule_key_from_task_panel_and_ordinal
  pairingUnit: task_and_scenario_family
  crossTaskCommonRandomNumbersClaim: false

execution:
  workers: 8
  numericThreadsPerWorker: 1
  rawCacheRoot: /cache/e07-s09
  noRuntimeDrivenWeakening: true
  failAtomicPanelPublication: true
  retainFailuresAndCensors: true
  retainAllTaskNativeStatuses: true
  replayEveryRow: true

taskLocalEndpoints:
  conjunctive_completion:
    field: conjunctiveCompletion
    direction: maximize
    margin: 0.0
  s01_global_mismatch:
    field: s01GlobalCompletionAudit.normalizedMismatch
    direction: minimize
    margin: 0.01
  s02_local_acceptance:
    field: s02LocalGrammar.accepted
    direction: maximize
    margin: 0.0
  formation_success:
    field: formationCompletion
    direction: maximize
    margin: 0.0
    missing: retain_unavailable_without_imputation
  repair_success:
    field: repairCompletion
    direction: maximize
    margin: 0.0

functionalEquivalence:
  exact:
    requiresIdentical:
      - stop_reason
      - failed
      - censored
      - task_local_outcome_projection
      - final_state_hash
    label: exact_on_tested_panel_only
  bounded:
    confidenceLevel: 0.95
    requires:
      - every_available_endpoint_lower_confidence_bound_at_or_above_negative_margin
      - no_increase_in_failure_or_censor_risk
      - all_native_contract_and_replay_checks_pass
      - structural_complexity_does_not_increase_for_causal_compression_edits
    label: endpoint_equivalent_on_tested_panel_only
  shamMustBeExact: true

statistics:
  pairedBootstrapReplicates: 2000
  pairedSignFlipReplicates: 2000
  seed: 70920260723
  multiplicity:
    method: Holm
    family: within_parent_and_edit_family_across_available_native_endpoints
  costAnalysis: fieldwise_paired_difference_only
  universalScore: forbidden
  crossTaskPooling: forbidden

causalInterpretation:
  necessaryWithinPanel: >-
    A prespecified edit produces Holm-significant harm beyond the frozen
    endpoint margin while the exact sham passes.
  removableWithinPanel: >-
    A prespecified edit passes bounded equivalence and all integrity guards on
    its paired panel.
  claimLimits:
    - simulator_internal
    - task_local
    - edit_relative
    - finite_panel
    - no_global_minimality
    - no_cross_task_generalization
    - no_biological_mechanism
    - no_confirmation_claim

artifacts:
  required:
    - compressed_policies.jsonl
