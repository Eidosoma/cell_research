schemaVersion: e07.s08l.logical-identity-plane-preregistration.v1
researchStepId: S08L
title: Preregister and qualify the outcome-independent logical-identity plane
preregisteredAtUtc: '2026-07-23T00:00:00Z'

frozenQuestion: >-
  Can four distinct pre-outcome identities—reservation slot, runtime
  configuration, physical execution, and logical result—make every legal
  one-to-many physical expansion unambiguous, restore every frozen reservation
  attribution, and keep every logical hash distinct without changing S08P?

authorizationBoundary:
  qualificationOnly: true
  structuralMetadataOnly: true
  qualificationFixturesOnly: true
  frozenSmokeRowsExecuted: 0
  episodeEvaluations: 0
  efficacyRowsRead: 0
  archiveConstructionCalls: 0
  validationOutcomeAccesses: 0
  confirmationOutcomeAccesses: 0
  s09Actions: 0
  s08kCacheReads: 0
  historicalQuarantineOutcomeReads: 0
  historicalArtifactMutations: 0

immutableScientificDesign:
  protocol: /artifacts/research_steps/S08P/s08p_portfolio_protocol.yaml
  mayChange:
    - pre_outcome_identity_metadata
    - identity_validation
    - logical_expansion_attribution
    - stable_logical_hash_domain
  mayNotChange:
    - candidate_eligibility
    - portfolio_members
    - comparators
    - selectors
    - member_memory
    - communication
    - native_costs
    - portfolio_costs
    - licensed_capability_costs
    - scenario_coupling
    - train_validation_confirmation_boundaries
