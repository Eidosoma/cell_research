    - descriptors
    - estimands
    - uncertainty
    - multiplicity
    - failure_or_censor_semantics
    - native_contracts
    - claim_boundaries
  scientificChangeRequired: fail_closed_and_return_for_human_review

identityContract:
  version: e07.s08l.logical-identity-plane.v1
  generatedBeforeOutcome: true
  reservationSlot:
    purpose: bind_exact_frozen_budget_reservation
    configurationReferenceSemantics: >-
      reservedConfigurationSlotId is the immutable S08P reservation reference.
      For adaptive slots it is not asserted to equal a generated runtime
      configuration ID.
    requiredFields:
      - stage
      - generation
      - taskId
      - split
      - scenarioFamilyOrdinal
      - logicalSlotOrdinal
      - logicalSlotId
      - reservedConfigurationSlotId
      - configurationRole
      - pairedSlotId
      - smoke
  runtimeConfiguration:
    purpose: bind_the_immutable_configuration_actually_dispatched
    requiredFields:
      - taskId
      - configurationId
      - configurationDefinitionSha256
      - mode
      - memberSetId
      - memberPolicySha256
  physicalExecution:
    purpose: bind_complete_equivalence_work_independent_of_logical_aliases
    source: e07.s08f.physical-dedup-equivalence.v1
    deduplicationLegalOnlyWhen:
      - action_behavior
      - native_task_scenario_carrier
      - selector_and_assignment
      - communication
      - portfolio_structural_cost
      - native_cost
      - licensed_capability_cost
    allEquivalent: required
  logicalResult:
    purpose: bind_one_logical_slot_to_one_reservation_runtime_and_physical_identity
    uniquenessKey: logicalSlotId
    distinctStableHashUnderPhysicalReuse: required
  physicalToLogicalExpansion:
    purpose: authenticate_the_complete_one_to_many_membership_before_outcomes
    membershipOrdering: canonical_sorted_logical_result_identity
    exactCardinality: required
    copiedOrAmbiguousMembership: fail_closed
  hash:
    algorithm: SHA-256
    canonicalization: sorted_key_compact_ascii_json_no_nan
    domainSeparated: true

qualificationPopulation:
  frozenInitialConfigurationBindings: 1216
  frozenInitialLogicalReservations: 4864
  frozenSmokeStructuralBindings: 40
  frozenAdaptiveLogicalReservations: 6144
  totalFrozenTrainingLogicalReservations: 11008
  adaptiveFixtureRuntimeChoice: >-
    Deterministic task/role-indexed selection from already frozen legal S08P
    configurations, using no objective, outcome, archive, promotion, or S07 arm
    field. Repeated choices are intentional alias/reuse stress cases and are
    not a reconstruction of any quarantined adaptive search.
  physicalRowsExecuted: 0

adversarialQualification:
  requiredCases:
    - repeated_same_configuration_same_scenario_distinct_slots
    - complete_equivalence_configuration_alias
    - adaptive_target_reservation_runtime_mismatch
    - adaptive_matched_random_reservation_runtime_mismatch
    - component_single_reservation
    - missing_binding
    - copied_binding_to_different_slot
    - duplicate_logical_slot
    - ambiguous_physical_membership
    - forged_reservation_commitment
    - forged_runtime_commitment
    - forged_physical_commitment
    - forged_expansion_membership
    - forged_binding_commitment
    - serialization_field_loss
  validCasesMustRoundTrip: true
  invalidCasesMustFailClosed: true

validation:
  exactReplay: required
  workerOrderIndependence: required
  serializationRoundTrip: required
  logicalCardinalityConservation: required
  physicalToLogicalCardinalityConservation: required
  all1216StructuralBindings: required
  all40SmokeBindingsStructuralOnly: required
  g01ToG06: required
  protectedDenialBeforeMaterialization: required
  rejectedDependencyExclusion: required
  s08pThroughS08kImmutable: required
  noArchiveOrProtectedOrExecutionMutation: required

gates:
