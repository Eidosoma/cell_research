schemaVersion: e07.s10a.missingness-accounting-protocol.v1
researchStepId: S10A
title: Remediate S10 missingness handling and durable all-row accounting
frozenQuestion: >-
  Can the S10 execution path retain legitimate feature unavailability and
  enforce the byte-frozen 90% task/native-status-stratum support rule without
  imputation, while durably accounting for every logical reservation and both
  physical replays before fail-atomic publication?

authorizationBoundary:
  outcomeIndependentQualificationOnly: true
  frozenS10EpisodeRows: 0
  smokeRows: 0
  discoveryRows: 0
  reproductionRows: 0
  machineFits: 0
  humanAnnotations: 0
  validationOutcomeAccess: 0
  confirmationOutcomeAccess: 0
  failedS10CacheReads: 0
  s06OrS06AModelOrEmbeddingLoads: 0
  s07ArmSignalUses: 0
  archiveMutations: 0
  s11Rows: 0

immutableInputs:
  s10pProtocol:
    path: /artifacts/research_steps/S10P/s10p_native_event_protocol.yaml
    sha256: fbf6f7d3645ac901c3d93e378a7118bf5a2262902b0428451840d7b8dbd276dd
  s10pTreeSha256: 541a0ecb17c8bcc2df498a935d075c8df5eab7509c80d5f591e60c152d6fd704
  failedS10TreeSha256: 20b8869c7892107357df401fea816a0a95ccbb7125372d5fb7492dc5c8502c40
  failedCache:
    path: /cache/e07-s10
    access: prohibited

missingnessContract:
  registeredAvailabilityRecordRequiredForEveryFeature: true
  analysisValueRequiresObservedState: true
  unavailableStateRequiresAbsentAnalysisValue: true
  explicitReasonRequired: true
  zeroNativeDenominator:
    state: unavailable
    frozenReason: structurally_not_applicable
    detailReasonCode: zero_native_denominator
  imputation: forbidden
  silentDrop: forbidden
  rowCompletenessRequirement: none
  supportUnit: task_id_by_native_status_stratum
  minimumAvailability: 0.90
  comparison: greater_than_or_equal
  minimumEligibleAnalysisFeatures: 5
  supportPatternUse: descriptive_only

accountingContract:
  logicalReservations:
    identity: frozen_logical_reservation_id_plus_position
    terminalDispositionRequired: true
  physicalReplays:
    countPerLogicalReservation: 2
    identity: preoutcome_domain_separated_commitment
    terminalDispositionRequired: true
  physicalToLogicalMembership:
    committedBeforeEvaluation: true
    exactCardinality: 2
  terminalPhysicalStates:
    - success
    - evaluator_exception
    - executor_exception
  terminalLogicalStates:
    - success
    - physical_failure
    - replay_mismatch
  forensicAvailability:
    featureCountAndReasonCodeSummaryPerPhysicalReplay: true
    efficacyValuesPersistedOnFailedBatch: false
  publication:
    resultRowsOnAllSuccess: all
    resultRowsOnAnyFailureOrMismatch: zero
    dispositionLedgerOnAllBranches: required
    precommitWrittenBeforeEvaluation: true
    finalLedgerAtomicReplace: true

qualification:
  fixturesOnly: true
  zeroDenominator: required
  supportFractions: [0.89, 0.90, 0.91]
  mixedAvailability: required
  workerOrders:
    - natural
    - reverse
    - deterministic_permutation
  injectedFailureLogicalPositions:
    - early
    - middle
    - late
  exactReplay: required
  serializationRoundTrip: required
  accountingConservation: required

preservedScientificDesign:
  population: unchanged
  estimands: unchanged
  methodsAndHyperparameters: unchanged
  thresholds: unchanged
  taskAndStatusStrata: unchanged
  traceAndCensorRules: unchanged
  claimBoundaries: unchanged

freshExecution:
  authorizedByS10A: false
  requiresSeparateApproval: true
  requiresGenuinelyFreshNamespace: true
