    phasesPerArtifactClass: [before_write, during_write, after_write]
    globalPhases:
      - before_full_validation
      - after_full_validation
      - before_commit
      - after_commit
  acceptedFinalStates:
    - zero_scientific_publication
    - complete_validated_publication
