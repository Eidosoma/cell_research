recordSchema:
  version: e07.s10g.method-record.v1
  families: [clustering, anomaly, change_point, fixed_holm]
  evidenceStates: [evidentiary, non_evidentiary]
  valueStates: [available, unavailable, not_applicable]
  nonEvidentiaryRawPValue: 1.0
  requiredExplicitValuePlanes:
    - configurationId
    - slotId
    - payload
    - rawPValue
    - holmAdjustedPValue
    - preMultiplicityGatePass
    - multiplicityPass
  dataframeRule: exact_nonnullable_columns_with_canonical_json_text_for_every_value_plane
  parquetRule: explicit_nonnullable_Arrow_schema_no_inference
  jsonRule: UTF-8_canonical_sorted_keys_allow_nan_false
  prohibited:
    - NaN
    - positive_or_negative_infinity
    - pandas_NA_or_NaT
    - numpy_nonfinite_scalars_or_arrays
    - absent_required_fields
    - inferred_or_ambiguous_dataframe_columns
publication:
  version: e07.s10g.global-scientific-publication.v1
  commitRule: validate_complete_staging_then_one_same_filesystem_atomic_directory_rename
  destinationMustBeAbsent: true
  exactForensicsOutsideScientificDestination: true
  artifactClasses:
    - {id: discovery_catalog, path: discovery_catalog.parquet, mediaType: parquet}
    - {id: preprocessing_results, path: preprocessing_results.parquet, mediaType: parquet}
    - {id: confound_audits, path: confound_audits.parquet, mediaType: parquet}
    - {id: clustering_results, path: clustering_results.parquet, mediaType: method_records_parquet}
