    - {id: discovery_lock, path: discovery_lock.json, mediaType: json}
    - {id: independent_reproduction_results, path: independent_reproduction_results.parquet, mediaType: parquet}
    - {id: machine_discovery_summary, path: machine_discovery_summary.json, mediaType: json}
    - {id: blinded_exemplar_packet, path: blinded_exemplar_packet.json, mediaType: json}
    - {id: reviewer_instructions, path: reviewer_instructions.md, mediaType: markdown}
    - {id: human_review_status, path: human_review_status.json, mediaType: json}
    - {id: native_event_feature_records, path: native_event_feature_records.parquet, mediaType: parquet}
